name: Update Sony Playlist

on:
  schedule:
    - cron: '30 * * * *'      # every hour at minute 0 (UTC)
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/sony.py'

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: true

    env:
      TZ: Asia/Kolkata

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Reset to Remote
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Script
        run: |
          python scripts/sony.py

      - name: Commit and Push Changes
        run: |
          git add sony5.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update Sony playlist ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          # Rebase onto latest remote (keep our generated file on conflicts)
          git pull --rebase -X theirs origin main

          # Push only if remote hasn't moved since rebase
          git push --force-with-lease origin main
