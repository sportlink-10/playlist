name: MIX IPTV 2 Auto-Update
on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set Timezone
        run: |
          echo "TZ=Asia/Kolkata" >> $GITHUB_ENV

      - name: Sync Repository
        run: |
          git pull origin main --rebase --autostash

      - name: Download and Update Playlist
        run: |
          echo "⏱️  Current time: $(date +'%Y-%m-%d %H:%M:%S IST')"
          curl -fsSL -o mixiptv2.m3u "https://raw.githubusercontent.com/darkbyteprojects/iptv_png/refs/heads/main/jiotv.m3u"
          echo "✅ Playlist downloaded successfully"
          echo "📝 File size: $(wc -c < mixiptv2.m3u) bytes"

      - name: Check for Changes
        id: check_changes
        run: |
          git add mixiptv2.m3u
          if git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⏭️  No changes detected"
            git reset HEAD mixiptv2.m3u
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✏️  Changes detected"
          fi

      - name: Commit Changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git commit -m "MIX IPTV Updated ✅ [$(date +'%d-%m-%Y %H:%M')]"
          echo "✔️  Changes committed"

      - name: Pull Before Push (Conflict Prevention)
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git pull origin main --rebase --autostash || true

      - name: Push to Repository
        id: push
        if: steps.check_changes.outputs.has_changes == 'true'
        continue-on-error: true
        run: |
          git push origin main
          echo "🚀 Pushed successfully to remote"

      - name: Handle Push Failure
        if: steps.push.outcome == 'failure'
        run: |
          echo "⚠️  Push failed, attempting force-with-lease..."
          git push origin main --force-with-lease

      - name: Verify File
        run: |
          if [ -f mixiptv2.m3u ]; then
            echo "✅ File mixiptv2.m3u exists"
            ls -lh mixiptv2.m3u
            echo "📊 File info:"
            file mixiptv2.m3u
            head -5 mixiptv2.m3u
          else
            echo "❌ File mixiptv2.m3u NOT found"
            ls -la
            exit 1
          fi

      - name: Workflow Summary
        run: |
          echo "📊 Workflow Summary:"
          echo "  Repository: https://github.com/sportlink-10/playlist"
          echo "  File: mixiptv2.m3u"
          echo "  Time: $(date +'%Y-%m-%d %H:%M:%S IST')"
          echo "  Status: ✅ Complete"
